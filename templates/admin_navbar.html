{% load static %}

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'src/output.css' %}" />
  <script src="{% static 'js/navbar.js' %}"></script>
</head>

<span class="absolute text-white text-4xl top-5 left-4 cursor-pointer" onclick="openMenu()">
  <i class="bi bi-filter-left px-2 bg-blue-900 opacity-80 rounded-md"></i>
</span>
<div class="sidebar fixed top-0 bottom-0 lg:left-0 left-[-300px] duration-1000
  p-2 w-[300px] overflow-y-auto text-center bg-blue-900 shadow h-screen" id='menu'>

  <div class="text-gray-100 text-xl">
    <!--Logo with X button-->
    <div class="mt-2 flex items-center rounded-md">
      <div class="flex items-center">
        <img src="{% static 'images/roxy_logo.png' %}" alt="Roxy logo" class="my-4" />
        <div onclick="closeMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="mb-2 w-6 h-6 hover:bg-blue-600 cursor-pointer absolute top-0 right-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </div>
      </div>
    </div>

    <hr class="my-2">

    <a href="{% url 'roxy_admin:AdminPage' %}">
    <div class="p-2.5 mt-2 flex items-center rounded-md px-4 duration-300 cursor-pointer  hover:bg-blue-800">
      <i class="bi bi-house-door-fill"></i>
      <span class="text-[15px] ml-4 text-gray-200">Home</span>
    </div>
    </a>

    <a href="{% url 'roxy_admin:Adv_search' %}">
    <div class="p-2.5 mt-2 flex items-center rounded-md px-4 duration-300 cursor-pointer  hover:bg-blue-800">
      <i class="bi bi-search "></i>
      <span class="text-[15px] ml-4 text-gray-200">Advanced Search</span>
    </div>
    </a>

    <a href="{% url 'roxy_admin:Calendar' %}">
    <div class="p-2.5 mt-2 flex items-center rounded-md px-4 duration-300 cursor-pointer  hover:bg-blue-800">
      <i class="bi bi-calendar-fill"></i>
      <span class="text-[15px] ml-4 text-gray-200">Calendar</span>
    </div>
    </a>

    <a href="{% url 'roxy_admin:QR_Scanner' %}">
    <div class="p-2.5 mt-2 flex items-center rounded-md px-4 duration-300 cursor-pointer  hover:bg-blue-800">
      <i class="bi bi-qr-code-scan"></i>
      <span class="text-[15px] ml-4 text-gray-200">QR Scanner</span>
    </div>
    </a>

    {% comment %} <hr class="my-4 text-black">
    <div class="p-2.5 mt-2 flex items-center rounded-md px-4 duration-300 cursor-pointer  hover:bg-blue-800">
      <i class="bi bi-envelope-fill"></i>
      <span class="text-[15px] ml-4 text-gray-200">Messages</span>
    </div>

    <div class="p-2.5 mt-2 flex items-center rounded-md px-4 duration-300 cursor-pointer  hover:bg-blue-800">
      <i class="bi bi-chat-left-text-fill"></i>
      <div class="flex justify-between w-full items-center" onclick="toggleDropDown()">
        <span class="text-[15px] ml-4 text-gray-200">Chatbox</span>
        <span class="text-sm rotate-180" id="arrow">
          <i class="bi bi-chevron-down"></i>
        </span>
      </div>
    </div>
    <div class=" leading-7 text-left text-sm font-thin mt-2 w-4/5 mx-auto hidden" id="submenu">
      <h1 class="cursor-pointer p-2 hover:bg-gray-700 rounded-md mt-1">Social</h1>
      <h1 class="cursor-pointer p-2 hover:bg-gray-700 rounded-md mt-1">Personal</h1>
      <h1 class="cursor-pointer p-2 hover:bg-gray-700 rounded-md mt-1">Friends</h1>
    </div>  {% endcomment %}

   <a href="{% url 'roxy:Logout' %}">
      <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-800">
        <i class="bi bi-box-arrow-in-right"></i>
        <span class="text-[15px] ml-4 text-gray-200">Logout</span>
      </div>
    </a>

    <hr class="my-2">

  </div>
</div>
