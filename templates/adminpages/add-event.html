{% extends 'base.html' %}
{% load static %}


{% block content %}

<body class="bg-gray-100 py-10">
  <div class="max-w-md mx-auto bg-white rounded-lg p-8 m-4 shadow-md">
    <h1 class="text-2xl font-bold mb-6">Create Event</h1>
    <form method="POST" action="{% url 'roxy:AddEvent' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label for="id_title" class="block text-gray-700 font-bold mb-2">Title:</label>
        <input id="id_title" name="title" type="text" class="border border-gray-300 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring focus:border-blue-300">
      </div>
      <div class="mb-4">
        <label for="id_description" class="block text-gray-700 font-bold mb-2">Description:</label>
        <textarea id="id_description" name="description" class="border border-gray-300 rounded-lg px-3 py-2 w-full h-24 resize-none focus:outline-none focus:ring focus:border-blue-300"></textarea>
      </div>
      <div class="mb-4">
        <label for="id_start_time" class="block text-gray-700 font-bold mb-2">Start Time:</label>
        <input id="id_start_time" name="start_time" type="datetime-local" class="border border-gray-300 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring focus:border-blue-300">
      </div>
      <div class="mb-4">
        <label for="id_end_time" class="block text-gray-700 font-bold mb-2">End Time:</label>
        <input id="id_end_time" name="end_time" type="datetime-local" class="border border-gray-300 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring focus:border-blue-300">
      </div>
      <div class="mb-4">
        <label for="id_surfers" class="block text-gray-700 font-bold mb-2">Surfers:</label>
        <select id="id_surfers" name="surfers" multiple class="border border-gray-300 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring focus:border-blue-300">
          {% for surfer in form.surfers %}
          <option value="{{ surfer.value }}">{{ surfer.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-4">
        <label for="id_volunteers" class="block text-gray-700 font-bold mb-2">Volunteers:</label>
        <select id="id_volunteers" name="volunteers" multiple class="border border-gray-300 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring focus:border-blue-300">
          {% for volunteer in form.volunteers %}
          <option value="{{ volunteer.value }}">{{ volunteer.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mt-6">
        <button type="submit" class="bg-blue-500 text-white rounded-lg px-4 py-2">Create Event</button>
      </div>
    </form>
  </div>
</body>
{% endblock %}
