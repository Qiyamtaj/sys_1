{% extends 'base.html' %}
{% load static %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <title>Event Calendar</title>
    <link rel="stylesheet" href="{% static 'src/output.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.0/fullcalendar.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css">

</head>
<body>
<body>
<div class="container mx-auto my-8">
    <div class="calendar">
        <div id="calendar"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.0/fullcalendar.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#calendar').fullCalendar({
                events: [
                    {% for event in events %}
                    {
                        title: "{{ event.title }}",
                        start: "{{ event.start_time|date:'Y-m-d H:i:s' }}",
                        end: "{{ event.end_time|date:'Y-m-d H:i:s' }}"
                    },
                    {% endfor %}
                ],
                // Calendar options and configurations
                // ...
            });
        });
    </script>
</div>

<div class="container mx-auto my-8">
    <a href="{% url 'roxy:AddEvent' %}">
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
            Add Event
        </button>
    </a>
</div>

</body>
{% endblock %}
