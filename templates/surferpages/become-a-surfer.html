{% load static %}

<head>
  <link href="{% static 'src/output.css' %}" rel="stylesheet" />
  <script src="{% static 'js/form_util.js' %}"></script>
  <title>Surfer Creation Form</title>
</head>

<body class="bg-gradient-to-tr from-pink-500 via-purple-500 to-blue-500">
  {% include 'include/messages.html' %}

  <form method="post" action="{% url 'roxy:UserCreate_Surfer' %}">
    {% csrf_token %}

    <!-- User Creation Form -->
    <div class="flex justify-center items-center">
      <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 my-2">
        <h2 class="mb-4">Start your surfing journey now!</h2>
        
        <!--Auto setting user's role to surfer-->
        <input type="hidden" name="role" value="Surfer">

        <!--Name fields -->
        <div class="-mx-3 md:flex mb-6">
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ user_form.first_name.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ user_form.first_name.label }}:
            </label>
            <input 
            type="text" name="{{ user_form.first_name.html_name }}"
            id="first_name" class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
            required value="{{ user_form.first_name.value }}">
          </div>

          <!-- Last name field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ user_form.last_name.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ user_form.last_name.label }}:
            </label>
            <input
              type="text"
              name="{{ user_form.last_name.html_name }}"
              id="last_name"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>
        </div>

        <!-- Email field -->
        <div class="md:w-full">
          <label
            for="{{ user_form.email.id_for_label }}"
            class="block text-sm font-normal"
            >{{ user_form.email.label }}:
          </label>
          <input
            type="email"
            name="{{ user_form.email.html_name }}"
            id="email"
            class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
            placeholder="youremail@example.com"
            required
          />
        </div>

        <!-- Password fields -->

        <div class="mx-3 md:flex mb-6">
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ user_form.password1.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ user_form.password1.label }}:
            </label>
            <input
              type="password"
              name="{{ user_form.password1.html_name }}"
              id="password1"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>

          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ user_form.password2.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ user_form.password2.label }}:
            </label>
            <input
              type="password"
              name="{{ user_form.password2.html_name }}"
              id="password2"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>
        </div>

        <!-- Surfer Form -->

          <!-- DOB field -->
          <div class="mx-3 md:flex mb-6">
            <label
              for="{{ surfer_form.DOB.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.DOB.label }}:
            </label>
            <input
              type="date"
              name="{{ surfer_form.DOB.html_name }}"
              id= "DOB"
              class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>
        </div>

        <!-- Split box -->
        <div class="-mx-3 md:flex mb-6">
          <!-- Gender field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.gender.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.gender.label }}:
            </label>
            <select
              name="{{ surfer_form.gender.html_name }}"
              id= "gender"
              class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            >
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Female">Non-binary</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Race field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.race.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.race.label }}:
            </label>
            <select
              name="{{ surfer_form.race.html_name }}"
              id= "race"
              class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            >
              <option value="">Select Ethinicity</option>
              <option value="African">African</option>
              <option value="Coloured">Coloured</option>
              <option value="Indian">Indian</option>
              <option value="Asain">Asain</option>
              <option value="Mixed">Mixed</option>
              <option value="White">White</option>
            </select>
          </div>
        </div>

        <!-- Phone number field -->
        <div class="md:w-full">
          <label
            for="{{ surfer_form.phone_number.id_for_label }}"
            class="block text-sm font-normal mb-2"
            >{{ surfer_form.phone_number.label }}:
          </label>
          <input
            type="tel"
            name="{{ surfer_form.phone_number.html_name }}"
            id= "phone_number"
            class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
            required
          />
        </div>

        <!-- Split box -->
        <div class="-mx-3 md:flex mb-6">
          <!-- Adress field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.address.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.address.label }}:
            </label>
            <input
              type="text"
              name="{{ surfer_form.address.html_name }}"
              id= "address"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>

          <!-- Country field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.country.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.country.label }}:
            </label>
            <input
              type="text"
              name="{{ surfer_form.country.html_name }}"
              id= "country"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>
        </div>

        <!-- Split box -->
        <div class="-mx-3 md:flex mb-6">
          <!-- Occupation field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.occupation.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.occupation.label }}:
            </label>
            <input
              type="text"
              name="{{ surfer_form.occupation.html_name }}"
              id= "occupation"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>

          <!-- School field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.school.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.school.label }}:
            </label>
            <input
              type="text"
              name="{{ surfer_form.school.html_name }}"
              id= "school"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>
        </div>

        <!-- Medical issues field -->
        <div class="md:w-full">
          <div class="flex">
            <label for="{{ surfer_form.medical_issues.id_for_label }}" class="block text-sm font-normal mb-2 w-1/2">{{ surfer_form.medical_issues.label }}:</label>

            <div class="w-1/2 flex justify-end">
              <p class="text-gray-500 text-sm mt-1">0/200</p>
            </div>
          </div>
          <textarea name="{{ surfer_form.medical_issues.html_name }}" id="medical_issues" rows="3" class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field" required></textarea>
        </div>

        <!-- Diagnosis and needs field -->
        <div class="md:w-full">
          <div class="flex">
            <label for="{{ surfer_form.diagnosis_and_needs.id_for_label }}" class="block text-sm font-normal mb-2 w-1/2">{{ surfer_form.diagnosis_and_needs.label }}:</label>
            
            <div class="w-1/2 flex justify-end">
              <p class="text-gray-500 text-sm mt-1">0/200</p>
            </div>
          </div>
          <textarea name="{{ surfer_form.diagnosis_and_needs.html_name }}" id="diagnosis_and_needs" rows="3" class="border md:w-full border-gray-300 rounded px-4 py-2 mb-4 input-field" required></textarea>
        </div>

        <!-- Medication field -->
        <div class="md:w-full">
          <div class="flex">
            <label for="{{ surfer_form.medication.id_for_label }}" class="block text-sm font-normal mb-2 w-1/2">{{ surfer_form.medication.label }}:</label>
            <div class="w-1/2 flex justify-end">
              <p class="text-gray-500 text-sm mt-1">0/200</p>
            </div>
          </div>
          <textarea name="{{ surfer_form.medication.html_name }}" id="medication" rows="3" class="border md:w-full border-gray-300 rounded px-4 py-2 mb-4 input-field" required></textarea>
        </div>

        <!-- Extra info field -->
        <div class="md:w-full">
          <div class="flex">
            <label for="{{ surfer_form.extra_info.id_for_label }}" class="block text-sm font-normal mb-2 w-1/2">{{ surfer_form.extra_info.label }}:</label>
            <div class="w-1/2 flex justify-end">
              <p class="text-gray-500 text-sm mt-1">0/200</p>
            </div>
          </div>
          <textarea name="{{ surfer_form.extra_info.html_name }}" id="id_description" rows="3" class="border md:w-full border-gray-300 rounded px-4 py-2 mb-4 input-field" required oninput="limitTextarea()"></textarea>
        </div>

        <!-- Split box -->
        <div class="-mx-3 md:flex mb-6">
          <!-- Swim longer than 5 minutes field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.swim_longer_than_5_min.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.swim_longer_than_5_min.label }}:
            </label>
            <select
              name="{{ surfer_form.swim_longer_than_5_min.html_name }}"
              id= "swim_longer_than_5_min"
              class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            >
              <option value="">Select an option</option>
              <option value="True">Yes</option>
              <option value="False">No</option>
            </select>
            </div>
           <!-- Comfortability in ocean field -->
<div class="md:w-1/2 px-3 mb-6 md:mb-0">
  <label for="{{ surfer_form.comfortability_in_ocean.id_for_label }}" class="block text-sm font-normal mb-2">
    How comfortable are you in the ocean?
  </label>
  <select name="{{ surfer_form.comfortability_in_ocean.html_name }}" id="comfortability_in_ocean"
          class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field" required>
    <option value="">Select an option</option>
    {% for value, label in surfer_form.comfortability_in_ocean.field.choices %}
      <option value="{{ value }}" {% if value == surfer_form.comfortability_in_ocean.value%}selected{% endif %}>
        {{ label }}
      </option>
    {% endfor %}
  </select>
</div>
</div>


        <!-- Split box -->
        <div class="-mx-3 md:flex mb-6">
          <!-- Emergency contact first name field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.emergency_contact_first_name.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.emergency_contact_first_name.label }}:
            </label>
            <input
              type="text"
              name="{{ surfer_form.emergency_contact_first_name.html_name }}"
              id= "emergency_contact_first_name"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>

          <!-- Emergency contact last name field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.emergency_contact_last_name.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.emergency_contact_last_name.label }}:
            </label>
            <input
              type="text"
              name="{{ surfer_form.emergency_contact_last_name.html_name }}"
              id= "emergency_contact_last_name"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>
        </div>

        <!-- Emergency contact cell field -->
        <div class="md:w-full">
          <label
            for="{{ surfer_form.emergency_contact_cell.id_for_label }}"
            class="block text-sm font-normal mb-2"
            >{{ surfer_form.emergency_contact_cell.label }}:
          </label>
          <input
            type="tel"
            name="{{ surfer_form.emergency_contact_cell.html_name }}"
            id= "emergency_contact_cell"
            class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
            required
          />
        </div>

        <!-- Split box -->
        <div class="-mx-3 md:flex mb-6">
          <!-- Medical aid field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.medical_aid.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.medical_aid.label }}:
            </label>
            <input
              type="text"
              name="{{ surfer_form.medical_aid.html_name }}"
              id= "medical_aid"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>

          <!-- Medical aid number field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.medical_aid_num.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.medical_aid_num.label }}:
            </label>
            <input
              type="text"
              name="{{ surfer_form.medical_aid_num.html_name }}"
              id= "medical_aid_num"
              class="border border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            />
          </div>
        </div>

        <!-- Split box -->
        <div class="-mx-3 md:flex mb-6">
          <!-- Accept TandC field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.accept_TandC.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.accept_TandC.label }}:
            </label>
            <select
              name="{{ surfer_form.accept_TandC.html_name }}"
              id= "accept_TandC"
              class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            >
              <option value="">Select an option</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>

          <!-- Receive newsletter field -->
          <div class="md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              for="{{ surfer_form.receive_newsletter.id_for_label }}"
              class="block text-sm font-normal mb-2"
              >{{ surfer_form.receive_newsletter.label }}:
            </label>
            <select
              name="{{ surfer_form.receive_newsletter.html_name }}"
              id= "receive_newsletter"
              class="border w-full border-gray-300 rounded px-4 py-2 mb-4 input-field"
              required
            >
              <option value="">Select an option</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>

        <!-- Submit button -->
        <div class="mb:w-full">
          <button
            type="submit"
            class="bg-blue-500 hover:bg-blue-700 w-full text-white font-normal py-2 px-4 rounded"
          >
            Submit
          </button>
        </div>
      </div>
    </div>
  </form>
</body>
